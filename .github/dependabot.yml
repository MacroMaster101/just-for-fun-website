version: 2
updates:
  # Dependency PRs follow the same flow as everything else: into dev first.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Majors that break the build until the ecosystem catches up.
      # eslint-config-next's plugins don't support ESLint 10 yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # TypeScript 7 is the Go-based compiler rewrite — upgrade deliberately.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Keep types in line with the Node version Vercel runs.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
